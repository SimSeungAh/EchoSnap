version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.6.0

  # Android SDK 36 환경과 호환되는 안정 버전
  flutter_secure_storage: ^10.3.1

  image_picker: ^1.2.3
  http_parser: ^4.1.2

  # 기기 내 TensorFlow Lite / LiteRT 추론
