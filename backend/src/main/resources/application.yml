spring:
  profiles:
    active: local

  config:
    import: optional:application-secret.yml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

ai:
  server:
    base-url: http://127.0.0.1:8000
    connect-timeout: 3s
    read-timeout: 30s